[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-bank-servicing"
version = "0.1.0"
description = "Granite PEFT training, dual-head routing, evaluation, and ZeroGPU demonstration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "torch>=2.9,<3",
]

[project.optional-dependencies]
scale = [
  "accelerate>=1.12,<2",
  "bitsandbytes==0.50.0",
  "datasets>=4.4,<5",
  "huggingface-hub>=1.4,<2",
  "peft>=0.18,<0.19",
  "safetensors>=0.6,<1",
  "transformers>=5.13,<5.14",
  "trl>=0.26,<0.27",
]
dev = [
  "gradio==5.49.1",
  "huggingface-hub>=1.4,<2",
  "mypy>=1.10",
  "pytest>=8",
  "ruff>=0.5",
  "safetensors>=0.6,<1",
  # The POC's Streamlit surface is imported by its test module, so the
  # documented `pytest poc/.../tests` command cannot even collect without it.
  "streamlit>=1.48,<2",
  "transformers>=5.13,<5.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests", "poc/retail-bank-customer-service-poc/tests"]
pythonpath = ["src", "poc/retail-bank-customer-service-poc"]

[tool.mypy]
files = ["src", "scripts", "tests"]

[[tool.mypy.overrides]]
module = [
  "accelerate",
  "accelerate.*",
  "bitsandbytes",
  "bitsandbytes.*",
  "datasets",
  "datasets.*",
  "peft",
  "peft.*",
  "trackio",
  "trackio.*",
  "transformers",
  "transformers.*",
  "trl",
  "trl.*",
]
follow_imports = "skip"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
