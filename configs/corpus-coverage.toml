# Declared use-case coverage for each training corpus.
#
# A cell is (intent, phrasing form, first_turn | multi_turn). Forms are
# imperative, wh_question ("What is my balance?"), modal_request ("Could you
# pull up my accounts?"), elliptical and deictic. wh_question and modal_request
# are distinct on purpose: the router handles modal requests, and it was the
# wh-question about an amount that it had never seen. `minimum` is a
# ratchet: the build fails if the corpus drops below it. `target` is the goal;
# a cell below target is reported, worst first, so empty cells set the
# authoring order. A cell that is empty today is declared with minimum 0 and a
# real target -- declaring it is the point, because the one that shipped empty,
# (view_accounts, wh_question, first_turn), was never written down anywhere.
#
# Measure with:  PYTHONPATH=src uv run python scripts/retail_bank/measure_corpus_coverage.py
# Raise a minimum only after the rows exist and the router has been retrained on them.
# The router corpus measured is the one HEAD builds,
# data/banking-conversation-router-v9-surface-form; the minimums below were
# raised on 2026-09-03 after the first-turn phrasing family landed and a router
# retrained on it passed every release gate (docs/08, section 4).

[router]

[router.categories]
# Floors for whole categories, independent of intent.
in_domain = 1
out_of_domain = 1
social = 1
counterfactual = 1
multi_turn = 1
long_running = 1
policy_question = 1
intent_drift = 1
loop_back = 1
agent_repair = 1
clarification_answer = 1
# Not present in the corpus today. Declared so the report says so on every run.
adversarial = 0
multi_intent = 0

# Every servicing read, asked as a real question on the first turn -- "What is
# my balance?", "Which cards do I have?". These are the plain first asks a
# customer types, and the corpus is built almost entirely around transitions
# between tasks rather than the tasks themselves.
[[router.cell]]
intent = "view_accounts"
form = "wh_question"
turn = "first_turn"
minimum = 10
target = 60

[[router.cell]]
intent = "view_cards"
form = "wh_question"
turn = "first_turn"
minimum = 10
target = 60

