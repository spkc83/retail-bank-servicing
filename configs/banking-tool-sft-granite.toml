[run]
name = "banking-servicing-v5-granite"
description = "Incremental Granite 9B grounded-policy and dialogue-resume PEFT configuration."
format = "banking_v5_tool_sft_config"
hub_dest = "spkc83/retail-bank-servicing-agent-9b"
private_hub_repo = false
push_to_hub_default = false

[model]
base_model = "spkc83/retail-bank-servicing-agent-9b"
base_revision = "1d56824995aa1adecfe20f62ca42fb1c0c443817"
family = "granite"
parameter_tier = "approximately_9b"

[dataset]
name = "data/banking-servicing-alignment-v5/manifest.json"
schema_version = "banking-tool-sft/v1"
tool_manifest = "public_banking_poc_nine_tools"
task = "grounded_policy_dialogue_resume_and_banking_tool_use_sft"

[training]
stack = "trl_sfttrainer_peft_bf16_lora"
precision = "bf16"
max_train_seconds = 14400
max_wallclock_hours = 5
checkpoint_every_steps = 250
merge_adapter = true
push_to_hub = false

[lora]
r = 32
alpha = 64
dropout = 0.05
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
